[package]
name = "aarushdex-jupiter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"

[dependencies]
jupiter-amm-interface = { version = "=0.6.1", path = "../jupiter-amm-interface/interface" }
rust_decimal = "1.36.0"
solana-account = { version = "=4.3.1", features = ["serde"] }
solana-instruction = "=3.4.0"
solana-pubkey = { version = "=4.2.0", features = ["curve25519", "wincode"] }
solana-address = "=2.6.1"

[dev-dependencies]
jupiter-amm-test-kit = { path = "../jupiter-amm-interface/test-kit" }
solana-compute-budget-interface = "=3.0.0"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.5", features = ["wincode"] }
serde_json = "1"
